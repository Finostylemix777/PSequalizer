name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Package Project Files
      run: |
        mkdir -p output_apk
        cp -r app output_apk/
        cp build.gradle output_apk/
        cp settings.gradle output_apk/
        cd output_apk
        zip -r ../PSequalizer-Project.zip *
        cd ..

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PSequalizer-Source-Package
        path: PSequalizer-Project.zip
